<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>FloodWatch Web-App</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
</head>

<body>


  <nav class="navbar">
    <div class="nav-container">

      <div class="logo">
        <img src="FloodWatch.png" alt="FloodWatch Logo">
      </div>

     
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="#">Documentation</a>
        <a href="AboutPage.html">About</a>
      </div>

      
    </div>

    <div class="dropdown-menu">
      <a href="index.html">Home</a>
      <a href="#">Documentation</a>
      <a href="AboutPage.html">About</a>
      <i class="fa-solid fa-xmark cancel" onclick="cancel()"></i>
    </div>
  </nav>

  
  <div class="layout">

    
    <div class="sidebar">

      <div class="input-box">
        <input type="text" placeholder="Search Location">
      </div>

      <button class="location-btn">Use Current Location</button>

      <h3>Rainfall Duration:</h3>
      <select class="dropdown-select">
        <option>Current</option>
        <option>1 Hour</option>
        <option>3 Hours</option>
        <option>6 Hours</option>
      </select>

      <h3>Current Alert Level:</h3>

      <div class="alert-bar">
        <span class="bar low"></span>
        <span class="bar moderate"></span>
        <span class="bar high"></span>
      </div>

      <div class="alert-labels">
        <span>Low</span>
        <span>Moderate</span>
        <span>High</span>
      </div>

      <button class="warning-btn yellow">YELLOW WARNING 🌧 </button>
      <button class="warning-btn orange">ORANGE WARNING 🌧</button>
      <button class="warning-btn red">RED WARNING 🌧</button>

    </div>

    <div class="main-container">

      <div class="map-box">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3874.738007983163!2d120.96237307508307!3d14.329796686882556!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397c994c48bb24f%3A0x9cead24b60226a83!2sDasmari%C3%B1as%2C%20Cavite!5e0!3m2!1sen!2sph!4v1700000000000!5m2!1sen!2sph"
          width="100%" height="100%" style="border:0;" allowfullscreen="">
        </iframe>
      </div>

      <div class="advisory-box">
        <!--
        
        <p><span class="yellow-dot"></span> <strong>Ankle Deep</strong></p>
        <p><strong>OFFICIAL ADVISORY:</strong> YELLOW RAINFALL WARNING</p>
        <p><strong>IMPACT:</strong> Flooding is possible in low-lying areas (Ankle Deep likely).</p>
        <p><strong>ACTION:</strong> Monitor the local situation closely. Secure outdoor items and prepare your emergency kit.</p>
        -->
      </div>

    </div>
  </div>
